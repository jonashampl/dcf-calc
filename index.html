<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DCF Kalkulačka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Průvodce výpočtem vnitřní hodnoty akcie metodou diskontovaného cash flow.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
<style>
/* Layout: guided formula workbench on the left, sticky live-valuation ledger on the right; one column with a bottom sheet on phones */
:root{
  --bg:#262624; --bg-sunk:#1E1E1C; --surface:#2F2F2C; --surface-2:#383834;
  --line:#4A4943; --line-soft:#3A3935; --ring:rgba(244,243,238,.16);
  --ink:#F4F3EE; --ink-2:#C4C2B8; --ink-3:#97958C; --ink-4:#6A6862;
  --chart-1:#C4C2B8; --chart-2:#66645E;
  --good:#A3BA88; --good-bg:rgba(163,186,136,.13);
  --bad:#E0919F; --bad-bg:rgba(224,145,159,.12);
  --warn:#D2C59A; --warn-bg:rgba(210,197,154,.10);
  --scrim:rgba(10,10,9,.6);
  --f-display:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace;
  --r-sm:7px; --r:10px; --r-lg:16px;
  color-scheme:dark;
}
:root[data-mode="light"]{
  --bg:#FAF9F5; --bg-sunk:#F1EFE7; --surface:#FFFFFF; --surface-2:#F4F2EC;
  --line:#D9D6CB; --line-soft:#E7E4DA; --ring:rgba(20,20,19,.10);
  --ink:#141413; --ink-2:#5C5B56; --ink-3:#6F6D66; --ink-4:#B3B0A6;
  --chart-1:#5C5B56; --chart-2:#C2BFB5;
  --good:#56713F; --good-bg:rgba(86,113,63,.10);
  --bad:#A2475C; --bad-bg:rgba(162,71,92,.08);
  --warn:#7E6F3D; --warn-bg:rgba(126,111,61,.09);
  --scrim:rgba(20,20,19,.35);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--f-ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:4px}
.ic{width:16px;height:16px;flex:none}
kbd{font:500 11px/1 var(--f-mono);padding:3px 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;color:var(--ink-2);background:var(--bg-sunk)}
sub,sup{font-size:.62em;line-height:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.muted{color:var(--ink-3)}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:11px;color:var(--ink)}
.logo{width:24px;height:auto;display:block}
.brand-name{font:500 20px/1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.top-act{display:flex;align-items:center;gap:8px}
.icon-btn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--ink-2);border:1px solid transparent}
.icon-btn:hover{background:var(--surface);color:var(--ink)}
.count{font:500 11px/1 var(--f-mono);color:var(--ink-3);margin-left:2px}

/* ---------- buttons & segmented ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:var(--r-sm);border:1px solid var(--line);color:var(--ink);font-weight:500;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,opacity .15s}
.btn:hover{background:var(--surface);border-color:var(--ink-4)}
.btn-primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn-primary:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn-ghost{border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{color:var(--ink);background:var(--surface);border-color:transparent}
.btn-sm{height:30px;padding:0 10px;font-size:13px}
.btn[aria-busy="true"]{opacity:.6;pointer-events:none}
.btn[aria-disabled="true"]{opacity:.45}
.seg{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--line-soft);border-radius:var(--r-sm);background:var(--bg-sunk);flex-wrap:wrap}
.seg button{height:30px;padding:0 12px;border-radius:5px;font-size:13.5px;color:var(--ink-3);font-weight:500;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface-2);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.seg-lang{flex-wrap:nowrap}
.seg-lang button{padding:0 9px;font:500 12px/1 var(--f-mono);letter-spacing:.04em}

/* ---------- banner ---------- */
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap;margin-top:18px;padding:12px 16px;border:1px solid var(--line-soft);border-radius:var(--r);background:var(--surface);font-size:14px;color:var(--ink-2)}
.banner b{color:var(--ink);font-weight:500}
.banner p{margin:0;max-width:78ch}

/* ---------- step rail ---------- */
.rail{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-top:22px}
.rs{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:0 0 6px;text-align:left;color:var(--ink-3);min-width:0}
.rs::before{content:"";display:block;width:100%;height:2px;border-radius:2px;background:var(--line-soft);transition:background .2s}
.rs-row{display:flex;align-items:center;gap:7px;min-width:0;width:100%}
.rs-n{flex:none;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:500 11px/1 var(--f-mono);border:1px solid var(--line)}
.rs-n .ic{width:11px;height:11px}
.rs-l{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rs:hover{color:var(--ink-2)}
.rs.done{color:var(--ink-2)}
.rs.done::before{background:var(--ink-3)}
.rs.done .rs-n{background:var(--ink-3);border-color:var(--ink-3);color:var(--bg)}
.rs.warn .rs-n{border-color:var(--warn);color:var(--warn)}
.rs.cur{color:var(--ink)}
.rs.cur::before{background:var(--ink)}
.rs.cur .rs-n{border-color:var(--ink);color:var(--ink)}

/* ---------- formula map ---------- */
.map-wrap{display:flex;align-items:center;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;margin-top:18px;padding:12px 0 2px}
.map{display:flex;align-items:center;gap:.32em;font:400 19px/1 var(--f-display);color:var(--ink-4);overflow-x:auto;padding:6px 2px;max-width:100%;scrollbar-width:none}
.map::-webkit-scrollbar{display:none}
.map .mt{font:inherit;color:var(--ink-4);padding:2px 3px;border-radius:5px;transition:color .2s,background .2s;white-space:nowrap}
.map .mt:hover{color:var(--ink-2)}
.map .mt.on{color:var(--ink);background:var(--surface)}
.map i{font-style:italic}
.map .mo{white-space:nowrap}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15}
.frac>span{padding:0 .25em;white-space:nowrap}
.frac>.num{border-bottom:1px solid currentColor;padding-bottom:.12em}
.frac>.den{padding-top:.12em;font-size:.86em}
.map-cap{margin:0;font-size:13px;color:var(--ink-3);max-width:52ch}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:44px;padding-block:20px 72px;align-items:start}
.main{min-width:0;display:flex;flex-direction:column;gap:26px;outline:none}
.main.enter{animation:stepIn .34s cubic-bezier(.2,.7,.2,1)}
@keyframes stepIn{from{transform:translateY(10px)}to{transform:none}}

/* ---------- step head ---------- */
.st-head{display:flex;flex-direction:column;gap:8px}
.eyebrow{margin:0;font:500 11.5px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.st-head h1{margin:0;font:400 36px/1.12 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
.lede{margin:0;color:var(--ink-2);max-width:66ch;font-size:15.5px}

/* ---------- formula card ---------- */
.card{border:1px solid var(--line-soft);border-radius:var(--r-lg);background:var(--surface);overflow:hidden}
.formula{display:flex;flex-direction:column;gap:20px;padding:30px 28px 24px}
.f-line{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 11px}
.lhs{display:inline-flex;align-items:center;height:48px;font:italic 400 27px/1 var(--f-display);color:var(--ink);white-space:nowrap}
.lhs.dim{color:var(--ink-3)}
.op{display:inline-flex;align-items:center;height:48px;font:400 25px/1 var(--f-display);color:var(--ink-3);white-space:nowrap}
.f-inl{display:inline-flex;align-items:flex-end;gap:11px}
.f-inl-v{display:inline-flex;align-items:center;height:48px;font:500 19px/1 var(--f-ui);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.f-opt{display:contents}
.f-sub{margin-top:-8px;font-size:13.5px;color:var(--ink-3)}
.f-note{margin:0;font-size:13.5px;color:var(--ink-3);max-width:70ch}
.f-note:empty{display:none}
.f-display .op,.f-display .lhs{height:auto}
.f-display{align-items:center;font:400 23px/1.2 var(--f-display);color:var(--ink-2)}
.f-display .frac{font-size:21px}

.slot{display:inline-flex;flex-direction:column;gap:5px;min-width:0}
.slot-sym{font:500 12px/1.2 var(--f-ui);color:var(--ink-3);padding-left:2px;white-space:nowrap}
.slot-box{display:inline-flex;align-items:center;gap:5px;height:48px;padding:0 13px;border:1px solid var(--line);background:var(--bg-sunk);border-radius:var(--r);cursor:text;transition:border-color .15s,box-shadow .15s,background .15s;position:relative}
.slot-box:hover{border-color:var(--ink-4)}
.slot.focus .slot-box{border-color:var(--ink);box-shadow:0 0 0 4px var(--ring)}
.slot.empty .slot-box{border-style:dashed}
.slot.bad .slot-box{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad-bg)}
.slot.shake .slot-box{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.slot-in{font:500 21px/1 var(--f-ui);font-variant-numeric:tabular-nums;color:var(--ink);background:none;border:0;outline:0;padding:0;width:4ch;min-width:2.5ch;text-align:right}
.slot-in::placeholder{color:var(--ink-4)}
.slot-text .slot-in{text-align:left;min-width:6ch;max-width:min(22ch,60vw)}
.slot-unit{font:400 14px/1 var(--f-ui);color:var(--ink-3);white-space:nowrap}
.slot-def .slot-sym::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ink-4);margin-left:6px;vertical-align:middle}
.slot-sel{appearance:none;-webkit-appearance:none;background:none;border:0;outline:0;font:500 17px/1 var(--f-ui);color:var(--ink);padding-right:18px;cursor:pointer}
.slot-sel option{background:var(--surface);color:var(--ink)}
.slot-cur .slot-box{padding-right:10px}
.slot-cur .ic{position:absolute;right:10px;pointer-events:none;color:var(--ink-3)}
.slot-sm .slot-box{height:40px;padding:0 11px}
.slot-sm .slot-in{font-size:17px}

.tok{display:inline-flex;flex-direction:column;align-items:stretch;gap:5px;text-align:left}
.tok-sym{font:500 12px/1.2 var(--f-ui);color:var(--ink-3);padding-left:2px;white-space:nowrap}
.tok-box{display:inline-flex;align-items:center;height:48px;padding:0 12px;border-radius:var(--r);background:var(--surface-2);font:500 17px/1 var(--f-ui);color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;border:1px solid transparent;transition:border-color .15s,color .15s}
button.tok:hover .tok-box{border-color:var(--line);color:var(--ink)}
.tok-mirror .tok-box{background:transparent;border:1px dashed var(--line)}

.f-result{display:flex;flex-direction:column;gap:2px;padding-top:16px;border-top:1px solid var(--line-soft)}
.f-res-cap{font-size:13px;color:var(--ink-3)}
.f-res-row{display:flex;align-items:flex-end;flex-wrap:wrap;gap:6px 12px}
.f-result .lhs{font-size:22px;height:44px}
.f-result .op{height:44px}
.f-val{display:inline-flex;align-items:center;height:44px;font:600 31px/1 var(--f-ui);letter-spacing:-.01em;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.f-unit{display:inline-flex;align-items:center;height:44px;font-size:14px;color:var(--ink-3)}
.f-check{display:inline-flex;align-items:center;height:44px;color:var(--ink-3);opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s}
.f-result.flash .f-check{opacity:1;transform:none;color:var(--ink)}
.f-result.flash .f-val{animation:pulse .6s}
@keyframes pulse{40%{opacity:.55}}

/* sentence (step 1) */
.sentence{display:flex;flex-direction:column;gap:18px;padding:30px 28px 26px}
.s-line{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.w{display:inline-flex;align-items:center;height:48px;font:400 25px/1 var(--f-display);color:var(--ink-2);white-space:nowrap}

/* help */
.help{border-top:1px solid var(--line-soft);background:var(--bg-sunk);padding:20px 28px 22px;display:flex;flex-direction:column;gap:10px;font-size:14px;color:var(--ink-2)}
.help:empty{display:none}
.help-head{display:flex;align-items:baseline;gap:10px}
.help-head h3{margin:0;font:500 15px/1.3 var(--f-ui);color:var(--ink)}
.help-sym{font:italic 400 18px/1 var(--f-display);color:var(--ink-3)}
.help p{margin:0;max-width:72ch}
.help dl{margin:0;display:grid;gap:8px}
.help dl>div{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px}
.help dt{font:500 11px/1.6 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.help dd{margin:0;max-width:70ch}
.help-note{font-size:13px;color:var(--ink-3)}
.help-err{color:var(--bad);font-weight:500}

/* choice cards (company type, method) */
.methods{display:flex;flex-direction:column;gap:12px}
.q{margin:0;font:500 15px/1.3 var(--f-ui)}
.m-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.method{display:flex;flex-direction:column;gap:10px;padding:18px 18px 16px;border:1px solid var(--line-soft);border-radius:var(--r-lg);text-align:left;transition:border-color .15s,background .15s}
.method:hover{border-color:var(--line);background:var(--surface)}
.method.on{border-color:var(--ink);background:var(--surface)}
.m-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.m-title{font:400 22px/1.1 var(--f-display)}
.m-meta{font:500 11px/1 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.m-f{font:400 12.5px/1.4 var(--f-mono);color:var(--ink-2)}
.m-d{font-size:13.5px;color:var(--ink-2)}
.m-pick{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink-3);margin-top:2px}
.method.on .m-pick{color:var(--ink)}
.ct .m-title{font-size:19px}

/* blocks, charts, tables */
.block{display:flex;flex-direction:column;gap:12px}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.block-head h2{margin:0;font:500 15px/1.3 var(--f-ui)}
.block-unit{font-size:12.5px;color:var(--ink-3)}
.block-lede{margin:0;color:var(--ink-2);font-size:14px;max-width:68ch}
.chart{min-height:40px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.c-grid{stroke:var(--line-soft);stroke-width:1}
.c-base{stroke:var(--ink-4);stroke-width:1}
.c-tick{fill:var(--ink-3);font:400 11px var(--f-ui);font-variant-numeric:tabular-nums}
.c-lab{fill:var(--ink-2);font:500 11.5px var(--f-ui);font-variant-numeric:tabular-nums}
.c-s1{fill:var(--chart-1)}
.c-s2{fill:var(--chart-2)}
.c-hit{fill:transparent}
.c-hit:hover{fill:var(--ring)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2)}
.legend>span{display:inline-flex;align-items:center;gap:7px}
.legend b{font-weight:500;color:var(--ink)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px}
.sw-1{background:var(--chart-1)}
.sw-2{background:var(--chart-2)}
.strip{display:flex;flex-wrap:wrap;gap:6px}
.strip span{font:400 12px/1 var(--f-mono);color:var(--ink-3);padding:6px 8px;border-radius:6px;background:var(--surface)}
.strip b{font-weight:500;color:var(--ink-2)}
.comp-bar{display:flex;gap:2px;height:14px}
.comp-bar span{min-width:3px}
.comp-bar span:first-child{border-radius:4px 0 0 4px}
.comp-bar span:last-child{border-radius:0 4px 4px 0}
.table-wrap{overflow-x:auto;border:1px solid var(--line-soft);border-radius:var(--r)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.t th,.t td{padding:9px 14px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-soft)}
.t th:first-child,.t td:first-child{text-align:left}
.t thead th{font:500 11px/1.4 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);background:var(--bg-sunk)}
.t tbody tr:last-child td{border-bottom:0}
.t tr.sum td{font-weight:600;color:var(--ink);background:var(--surface)}
.t tr.nx td{color:var(--ink-3);font-style:italic}
.t td{color:var(--ink-2)}

/* warnings & issues */
.warns{display:flex;flex-direction:column;gap:8px}
.warns:empty{display:none}
.wn{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:var(--r);font-size:13.5px;color:var(--ink-2)}
.wn p{margin:0;max-width:72ch}
.wn .ic{margin-top:2px}
.wn.warn{background:var(--warn-bg)}
.wn.warn .ic{color:var(--warn)}
.wn.bad{background:var(--bad-bg)}
.wn.bad .ic{color:var(--bad)}
.wn.info{background:var(--surface)}
.wn.info .ic{color:var(--ink-3)}
.wn .btn{margin-top:8px}
.issues{display:flex;flex-direction:column;gap:10px;padding:18px 20px;border-radius:var(--r-lg);border:1px solid var(--bad);background:var(--bad-bg)}
.issues.neutral{border-color:var(--line);background:var(--surface)}
.issues h3{margin:0;font:500 16px/1.3 var(--f-ui);color:var(--ink);display:flex;gap:8px;align-items:center}
.issues h3 .ic{color:var(--bad)}
.issues.neutral h3 .ic{color:var(--ink-3)}
.issues p{margin:0;color:var(--ink-2);font-size:14px;max-width:72ch}
.issues ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.issues li{display:flex;justify-content:space-between;align-items:center;gap:8px 14px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.issues li span{max-width:62ch}

/* advanced */
.adv{border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.adv summary{display:flex;align-items:center;gap:10px;padding:14px 2px;cursor:pointer;list-style:none;font-weight:500;font-size:14px;color:var(--ink-2)}
.adv summary::-webkit-details-marker{display:none}
.adv summary .ic{transition:transform .2s;color:var(--ink-3)}
.adv[open] summary .ic{transform:rotate(180deg)}
.adv summary:hover{color:var(--ink)}
.adv-hint{font-weight:400;color:var(--ink-3);font-size:13px}
.adv-body{display:flex;flex-direction:column;gap:20px;padding:4px 2px 22px}
.adv-row{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap}
.adv-text{display:flex;flex-direction:column;gap:3px;max-width:58ch;min-width:0;flex:1 1 280px}
.adv-text label,.adv-text .lbl{font-weight:500;font-size:14px;color:var(--ink)}
.adv-text p{margin:0;font-size:13px;color:var(--ink-3)}
.adv-note{margin:0;font-size:13px;color:var(--ink-3)}
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;width:100%}
.cg-cell{display:flex;flex-direction:column;gap:5px;font:500 11px/1 var(--f-mono);color:var(--ink-3)}
.cg-cell .slot-box{height:38px;padding:0 9px}
.cg-cell .slot-in{font-size:15px;width:100%}
.cg-cell.bad .slot-box{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}

/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:4px}
.kbd-hint{font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}

/* verdict */
.verdict{display:flex;flex-direction:column;gap:14px}
.v-hero{display:flex;flex-direction:column;gap:6px}
.v-num{font:600 58px/1 var(--f-ui);letter-spacing:-.025em;color:var(--ink)}
.v-cap{font-size:14px;color:var(--ink-3)}
.v-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--ink-3)}

.v-concl{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;max-width:66ch}
.v-concl li{display:flex;gap:10px;align-items:flex-start;color:var(--ink-2)}
.v-concl .ic{margin-top:4px;color:var(--ink-3)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px 0 8px;border-radius:999px;font:500 12.5px/1 var(--f-ui);white-space:nowrap}
.chip .ic{width:13px;height:13px}
.chip.good{color:var(--good);background:var(--good-bg)}
.chip.bad{color:var(--bad);background:var(--bad-bg)}
.chip.neutral{color:var(--ink-2);background:var(--surface-2)}

/* scenarios */
.scen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sc{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--line-soft);border-radius:var(--r-lg);min-width:0}

.sc.invalid{border-color:var(--bad)}

.sc-p{font:400 12px/1 var(--f-mono);color:var(--ink-3)}
.sc-v{font:600 26px/1.15 var(--f-ui);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.sc-up{font-size:13px;color:var(--ink-3)}
.sc-err{margin:0;font-size:13px;color:var(--bad)}
.sc-err:empty{display:none}
.sc dl{margin:10px 0 0;padding-top:12px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:8px}
.sc dl>div{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:30px}
.sc dt{font-size:13px;color:var(--ink-3);min-width:0}
.sc dd{margin:0;display:flex;align-items:center;gap:8px;font-size:13.5px}
.sc dd b{font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums;min-width:4.6em;text-align:right}
.mini{display:inline-flex;align-items:center;gap:3px;height:30px;padding:0 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg-sunk)}
.mini:focus-within{border-color:var(--ink)}
.mini.bad{border-color:var(--bad)}
.mini-in{width:3.6ch;border:0;outline:0;background:none;font:500 13px/1 var(--f-ui);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.mini span{font-size:11px;color:var(--ink-3);white-space:nowrap}
.weighted{margin:0;font-size:14px;color:var(--ink-2)}
.weighted b{font-weight:500;color:var(--ink)}
.r-track{stroke:var(--line-soft);stroke-width:1}
.r-span{stroke:var(--chart-2);stroke-width:4;stroke-linecap:round}
.r-price{stroke:var(--ink-2);stroke-width:1.5}
.r-dot{fill:var(--chart-1);stroke:var(--bg);stroke-width:2}
.r-base{fill:var(--ink)}
.r-lab{fill:var(--ink-2);font:500 11.5px var(--f-ui);font-variant-numeric:tabular-nums}
.r-sub{fill:var(--ink-3);font:400 11px var(--f-ui)}
.r-hit{fill:transparent}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.disclaimer{margin:0;font-size:12.5px;color:var(--ink-3);max-width:72ch}

/* ---------- ledger ---------- */
.ledger{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);border:1px solid var(--line-soft);border-radius:var(--r-lg);background:var(--surface);min-width:0}

.lg-rows{margin:0;display:flex;flex-direction:column}
.lg-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-top:1px solid var(--line-soft);font-size:13.5px;text-align:left;width:100%;color:var(--ink-3)}
.lg-row:hover{color:var(--ink-2)}

/* ---------- dialog, toast, confirm, tip ---------- */
dialog.lib{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-lg);padding:0;width:min(600px,calc(100vw - 32px));max-height:min(80vh,720px)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(12px);z-index:60;background:var(--ink);color:var(--bg);font-size:13.5px;font-weight:500;padding:10px 16px;border-radius:var(--r);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px);text-align:center}

#report-host{position:fixed;left:-20000px;top:0;width:794px;pointer-events:none}

/* ---------- hover hints & source badges ---------- */
.hint{position:fixed;z-index:72;pointer-events:none;width:max-content;max-width:300px;padding:12px 14px 13px;border-radius:var(--r);background:var(--surface-2);border:1px solid var(--line);box-shadow:0 16px 36px -16px rgba(0,0,0,.55);font-size:13px;line-height:1.45;color:var(--ink-2);opacity:0;transform:translateY(4px);transition:opacity .14s,transform .14s}
.hint.show{opacity:1;transform:none}
.hint-t{font-weight:500;color:var(--ink);margin:9px 0 3px}
.hint p{margin:0}
.hint .hint-h{margin-top:7px;color:var(--ink-3)}
.hint .hint-h b{font-weight:500;color:var(--ink-2)}
.kb{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px 0 6px;border-radius:999px;font:500 10.5px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;color:var(--ink-3);background:var(--bg-sunk);border:1px solid var(--line-soft)}

.link{color:var(--ink-2);text-decoration:underline;text-decoration-color:var(--ink-4);text-underline-offset:3px;font:inherit}

/* ---------- explanations & WACC step ---------- */
.explain{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line-soft);font-size:14px;color:var(--ink-2)}
.explain .ic{margin-top:3px;color:var(--ink-3)}
.explain b{color:var(--ink);font-weight:500}
.explain p{margin:0;max-width:72ch}
.explain.fin{border-color:var(--bad);background:var(--bad-bg)}
.explain.fin .ic{color:var(--bad)}
.f-group{display:flex;flex-direction:column;gap:10px}
.f-group+.f-group{padding-top:18px;border-top:1px solid var(--line-soft)}
.f-cap{display:flex;gap:10px;align-items:flex-start}
.f-cap-n{flex:none;width:20px;height:20px;margin-top:1px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font:500 11px/1 var(--f-mono);color:var(--ink-3)}
.f-cap-t{font-weight:500;font-size:14px;color:var(--ink)}
.f-cap-d{font-size:13.5px;color:var(--ink-3)}
.f-sum{margin:0;font-size:14px;color:var(--ink-2);max-width:68ch}
.f-sum:empty{display:none}
.ws-bar{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;height:10px;margin-top:34px}
.ws-bar>span{background:var(--surface-2);border-radius:3px}
.ws-bar>span.on{background:var(--chart-2)}
.ws-line{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--ink);border-radius:1px;transform:translateX(-50%)}
.ws-lab{position:absolute;bottom:calc(100% + 12px);transform:translateX(-50%);font:500 12.5px/1 var(--f-ui);color:var(--ink);white-space:nowrap}
.ws-labels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin-top:12px;font-size:12px;color:var(--ink-3)}
.ws-labels span{display:flex;flex-direction:column;gap:2px;padding-right:6px}
.ws-labels b{font-weight:500;color:var(--ink-3)}
.ws-labels .on b{color:var(--ink)}

/* ---------- responsive ---------- */

}

}

    beta:[null,'Jak moc akcie kolísá oproti celému trhu. 1 = stejně jako trh.','Profil akcie na finančním portálu, např. „Beta (5Y Monthly)“ na Yahoo Finance.'],
    erp:[null,'Kolik procent navíc chtějí investoři za riziko akcií oproti dluhopisům.','Převezmi z veřejných odhadů (Damodaran, NYU). Pro rozvinuté trhy obvykle 4–6 %.'],

    gT:[null,'Tempo růstu navždy po skončení projekce.','Zhruba inflace plus malý reálný růst, obvykle 2–3 %. Aspoň o 0,25 p. b. pod WACC.'],
    exitMult:[null,'Kolikanásobek ročního cash flow (EBITDA) by za firmu zaplatil kupec.','Podívej se, za kolik se obchodují podobné firmy z odvětví (EV/EBITDA, EV/FCF).'],
    debt:[null,'Všechny úvěry, půjčky a dluhopisy firmy.','Rozvaha: krátkodobé a dlouhodobé úvěry a dluhopisy.'],

    margin0:['Provozní marže','Kolik procent z tržeb zbude jako provozní zisk.','EBIT ÷ tržby.'],

    fcfT:['FCFFₜ · cash flow v roce t','Odhad volného cash flow firmy v budoucím roce t.','Jednoduše: předchozí rok × (1 + růst). Od tržeb: z tržeb, marže, daně a investic daného roku.'],
    fcfPrev:['FCFFₜ₋₁ · předchozí rok','Cash flow roku před tím. Pro první rok je to dnešní FCFF₀.','Spočítáno v předchozím roce projekce.'],

    fcfNext:['FCFF roku N+1','Cash flow prvního roku po projekci, kdy firma roste už jen terminálním tempem. Z něj se počítá terminální hodnota.','Jednoduše: FCFF posledního roku × (1 + g_T). Od tržeb: normalizovaný rok s cílovou marží a nižšími investicemi.'],
    nopatNext:['NOPAT roku N+1','Provozní zisk po zdanění v normalizovaném roce N+1.','Tržby N+1 × cílová marže × (1 − t).'],
    netInvNext:['Čisté investice roku N+1','CapEx minus odpisy v roce N+1. Při pomalejším růstu firma potřebuje investovat méně.','Čisté investice z projekce zmenšené v poměru terminálního růstu k poslednímu růstu.'],
    dnwcNext:['ΔNWC roku N+1','Nárůst pracovního kapitálu v roce N+1, roste jen spolu s tržbami.','(NWC ÷ tržby) × přírůstek tržeb.'],
    re:['Rₑ · náklady vlastního kapitálu','Roční návratnost, kterou za riziko chtějí akcionáři.','Model CAPM: r<sub>f</sub> + β × ERP (+ případná přirážka).'],

    ew:['E/V · podíl vlastního kapitálu','Jakou část financování tvoří peníze akcionářů.','1 − podíl dluhu (D/V).'],
    wacc:['WACC · diskontní sazba','Průměrná návratnost, kterou chtějí akcionáři i věřitelé. Tímto tempem „zlevňujeme“ budoucí peníze na dnešek.','Spočítáno v kroku 4.'],

    sumPV:['Současná hodnota cash flow','Součet všech let projekce přepočtených na dnešek.','Každý rok FCFFₜ ÷ (1 + WACC)ᵗ, pak součet.'],

    ev:['EV · hodnota firmy','Hodnota celé firmy, která patří věřitelům i akcionářům.','Současná hodnota cash flow + současná hodnota TV.'],
    eq:['VK · vlastní kapitál','Část hodnoty firmy, která patří akcionářům.','EV − dluh + přebytečná hotovost − menšinové podíly.'],
    nShares:['Akcie celkem','Počet akcií, mezi které se hodnota dělí, včetně možného zředění.','Akcie v oběhu + zřeďující akcie.'],
    ps:['V · vnitřní hodnota akcie','Kolik má podle tvých předpokladů hodnotu jedna akcie.','Vlastní kapitál ÷ akcie celkem.'],
    mosNow:['MoS · bezpečnostní marže','O kolik procent je cena pod vnitřní hodnotou. Záporné číslo znamená, že je nad ní.','(V − P) ÷ V.'],

  m:{ q:'How do you want to calculate cash flow?', pick:'Choose', picked:'Selected',
      simple:{ t:'From the cash flow statement', f:'FCFF = CFO + interest × (1 − t) − CapEx', d:'Start from operating cash flow, add back after-tax interest and subtract investment. Suits stable profitable companies with positive cash flow.', m:'4 inputs' },
      detailed:{ t:'From revenue', f:'FCFF = EBIT − tax + D&A − CapEx − ΔNWC', d:'Build cash flow from revenue through margin, taxes, investment and working capital. Required for loss-making companies or changing margins.', m:'7 inputs' } },
  st:[
    { title:'What is the company really worth?', lede:'A DCF (discounted cash flow) values a company by the money it will earn in the future, converted to today’s value. We will go step by step: click into the formula, type a number, and Enter takes you further.' },
    { title:'How much cash the business makes', lede:'Free cash flow to the firm (FCFF) is the money operations generate for everyone who finances the company: lenders and shareholders. That is why we add after-tax interest back to operating cash flow. Debt is subtracted only at the end.', ledeD:'We build free cash flow to the firm (FCFF) from operating profit: subtract tax, add back depreciation, then subtract investment and the increase in working capital. The working capital balance tells us how much cash the business will tie up as it grows.' },
    { title:'How fast it will grow', lede:'Estimate how free cash flow will develop over the coming years. It is the most important and the most uncertain assumption in the whole analysis.', ledeD:'Estimate how revenue will grow. Each year’s operating profit, tax, investment and working capital follow from it.' },
    { title:'What return do you require', lede:'Money in five years is worth less than money today. The discount rate (WACC) sets how much future cash flow loses when converted to today. The riskier the company, the higher the rate.' },
    { title:'What comes after the projection', lede:'The company does not disappear after the last projected year. The terminal value sums up all the cash flow that comes afterwards into a single number. We calculate it from year N+1, when the company grows only at its long-run rate.' },
    { title:'Converting to today’s value', lede:'We divide each year’s cash flow by its discount factor and add them up. Adding the terminal value gives the value of the whole company (EV, enterprise value).' },
    { title:'How much is one share worth', lede:'The company’s value belongs to lenders and shareholders. We subtract debt, add excess cash, and split the rest across all shares.' },
    { title:'Verdict', lede:'Compare the intrinsic value with the market price and with your required margin of safety. Scenarios show how the result changes if your assumptions do not hold.' }
  ],
  f:{
    name:{ short:'Company name', name:'Company name', what:'Used only for your reference, saving and export.', ph:'Company name' },
    ticker:{ short:'Ticker', name:'Ticker', what:'The stock symbol, for example AAPL or CEZ. Optional.', ph:'—' },
    currency:{ short:'Currency', name:'Currency', what:'The currency the company reports in and the share price is quoted in. Enter every amount in this currency.' },
    price:{ short:'Share price', sym:'P', name:'Current share price', what:'What one share trades for on the exchange right now. At the end we compare it with the intrinsic value.', where:'The exchange website or a finance portal (Yahoo Finance, Google Finance), by ticker.' },
    horizon:{ short:'Projection length', sym:'N', name:'Projection length', what:'How many years ahead you forecast cash flow year by year. After that, the terminal value takes over. The whole analysis follows this length.', where:'This is not a number from the reports but your choice. Stable companies need 5 years. Give fast growers 7–10 years so their growth has time to slow to a normal pace. A longer projection means more estimates and more uncertainty.', typ:'5–10 years (3–20 allowed)' },
    cfo:{ short:'Operating cash flow', sym:'CFO', name:'Operating cash flow', what:'The cash the business generated from its normal operations in a year. It is usually already reduced by taxes and often by interest paid.', where:'Cash flow statement, line “Net cash provided by operating activities”. Use the last full year or the sum of the last four quarters (TTM).' },
    interest:{ short:'Interest paid', sym:'Int', name:'Interest paid', what:'Interest paid to lenders over the same period. We add it back after tax, because free cash flow to the firm is measured before payments to lenders and debt is subtracted at the end.', where:'Cash flow statement or notes: “Interest paid” or “Cash paid for interest”. Enter it only when it sits within operating activities (always under US GAAP, often under IFRS). If the company reports it in financing activities, enter 0.', typ:'Roughly interest rate × debt' },
    capex:{ short:'Capital spending', sym:'CapEx', name:'Capital expenditures (CapEx)', what:'Money spent on buildings, machines, software and other long-term assets the business needs to keep running and growing.', where:'Cash flow statement, investing activities, line “Purchases of property and equipment”. It is shown as a negative number there; enter it as positive.' },
    fcfAdj:{ short:'Adjustment', name:'One-off adjustment', what:'Was the last year unusual? Selling a division, a lawsuit or an exceptional contract distorts cash flow. A positive number raises the starting FCFF, a negative one lowers it.' },
    rev:{ short:'Revenue', sym:'Rev', name:'Revenue', what:'Total income from selling products and services in a year. In the detailed model everything else follows from it.', where:'Income statement, line “Total revenue”.' },
    ebit:{ short:'Operating profit', sym:'EBIT', name:'Operating profit (EBIT)', what:'Profit from the core business before interest and taxes. Divided by revenue it gives the operating margin. It can be negative.', where:'Income statement, line “Operating income”.' },
    tax:{ short:'Tax rate t', sym:'t', name:'Tax rate', what:'The share of profit the company pays in income tax. A loss does not refund tax: with negative profit we use zero tax and offset the loss against future profits.', where:'Effective rate = income tax ÷ profit before tax, both on the income statement. Or use the statutory rate: 21% in the Czech Republic and the US (federal).', typ:'15–30%' },
    da:{ short:'Depreciation D&A', sym:'D&A', name:'Depreciation and amortization', what:'An accounting cost for the wear of assets. It lowers profit but is not an actual cash outflow, so we add it back.', where:'Cash flow statement, operating activities, line “Depreciation and amortization”.' },
    dnwc:{ short:'Change in WC ΔNWC', sym:'ΔNWC', name:'Change in working capital last year', what:'How much working capital changed over the last year. When it grows, the company locks cash into operations and free cash flow falls.', where:'Cash flow statement, operating activities: changes in inventory, receivables and payables. Add them up and flip the sign. If working capital grew, enter a positive number; if it shrank, a negative one.' },
    nwc:{ short:'Working capital NWC', sym:'NWC', name:'Working capital (year-end balance)', what:'How much cash is tied up in operations: inventory and receivables minus payables to suppliers. Its ratio to revenue tells us how much cash the company will need as it grows.', where:'Balance sheet: inventory + trade receivables − trade payables (excluding cash and debt). It can be negative, for example at retailers.' },
    nol:{ short:'Tax losses', name:'Unused tax loss carryforwards', what:'Losses from past years that the company can offset against future profits, so it pays less tax. Leave empty if there are none.', where:'Notes to the financial statements, income tax section: “Net operating loss carryforwards”.' },
    targetMargin:{ short:'Target margin', name:'Target EBIT margin in the final year', what:'Do you expect the margin to improve or worsen? Set where it ends up in the last projected year; it moves evenly in between. Leave empty to keep it unchanged. For a loss-making company this is where you set the path to profit.' },
    g:{ short:'Annual growth g', sym:'g', name:'Annual growth', what:'How many percent per year free cash flow will grow over the coming years.', whatD:'How many percent per year revenue will grow over the coming years. Cash flow then follows from margin, taxes and investment.', where:'Guides: average growth over the last 3–5 years, analyst estimates and the growth of the whole industry. Lean cautious; high growth rarely lasts long.', typ:'Mature companies 2–6%, growing 8–15%, above 20% only rarely' },
    rf:{ short:'Risk-free rate', sym:'r<sub>f</sub>', name:'Risk-free rate', what:'The return you get with almost no risk, typically from a government bond. Every riskier investment has to pay more.', where:'The yield of a 10-year government bond in the company’s currency. The central bank or any finance portal publishes it.', typ:'2–5%' },
    beta:{ short:'Beta β', sym:'β', name:'Beta', what:'How much the stock moves relative to the whole market. A beta of 1 moves with the market, 1.5 moves half as much again, 0.7 less.', where:'Finance portals list it in the stock profile; Yahoo Finance shows “Beta (5Y Monthly)”.', typ:'0.6–1.6' },
    erp:{ short:'Risk premium', sym:'ERP', name:'Equity risk premium', what:'How many percent per year above government bonds investors want for holding riskier stocks.', where:'Professor Aswath Damodaran (NYU Stern) publishes estimates by country. For developed markets 4–6% is common.', typ:'4–6%' },
    rd:{ short:'Cost of debt', sym:'R<sub>d</sub>', name:'Cost of debt', what:'The interest rate the company borrows at. Interest lowers taxable income, so the formula multiplies it by (1 − t).', where:'Interest expense from the income statement ÷ average debt from the balance sheet. Or the yield on the company’s bonds.', typ:'1–3 percentage points above the risk-free rate' },
    dv:{ short:'Debt weight D/V', sym:'D/V', name:'Debt share of financing', what:'What part of the company’s financing is debt. The rest (E/V) is shareholders’ equity.', where:'Debt ÷ (debt + market capitalization). Market cap = share price × number of shares.', typ:'Tech 0–15%, industrials and energy 20–50%' },
    extraPrem:{ short:'Premium', name:'Company-specific risk premium', what:'Added to the cost of equity. Used for small companies, companies in risky countries or with an uncertain business.', typ:'0–4%' },
    waccOverride:{ short:'Own rate', sym:'r', name:'Your own discount rate', what:'The return you require from the investment. Enter it directly (for example 10%) and the CAPM calculation is skipped.', typ:'7–12%' },
    gT:{ short:'Terminal growth', sym:'g<sub>T</sub>', name:'Terminal growth', what:'The rate at which cash flow grows forever after the projection ends.', where:'It should not exceed long-run economic growth. 2–3% is common, roughly inflation plus a little real growth. It must be at least 0.25 percentage points below WACC.', typ:'1.5–3%' },
    exitMult:{ short:'Multiple', sym:'×', name:'Exit multiple', what:'How many times annual free cash flow a buyer would pay for the company at the end of the projection.', whatD:'How many times EBITDA (operating profit before depreciation) a buyer would pay for the company at the end of the projection.', where:'Look at what similar companies trade for today: EV/FCF, or EV/EBITDA in the detailed model.', typ:'EV/EBITDA 6–14×, EV/FCF 12–25×' },
    debt:{ short:'Debt', sym:'D', name:'Total debt', what:'All loans, credit lines and issued bonds. Lenders rank ahead of shareholders, so we subtract debt.', where:'Balance sheet: short-term and long-term debt. You can also include lease liabilities.' },
    cash:{ short:'Cash', sym:'C', name:'Cash', what:'Cash and short-term investments held by the company. Excess cash belongs to shareholders, so we add it. You can subtract the cash needed for operations in the advanced options.', where:'Balance sheet: “Cash and cash equivalents” plus short-term investments.' },
    opCash:{ short:'Operating cash', name:'Cash needed for operations', what:'The part of cash the company needs to run day to day (payroll, supplier payments). It is not extra value for shareholders, so we subtract it from cash.', where:'Not in the reports; it is an estimate. 1–3% of annual revenue is common. Leave empty if you treat all cash as excess.' },
    minority:{ short:'Minority interests', name:'Minority interests', what:'The part of subsidiaries owned by other shareholders. It is subtracted from the value for shareholders.', where:'Balance sheet, equity section: “Non-controlling interests”.' },
    shares:{ short:'Shares', sym:'N', name:'Shares outstanding', what:'How many shares are outstanding as of the valuation date. The company’s value is split into that many pieces.', where:'Cover page of the latest quarterly or annual report: “shares outstanding as of [date]”. Avoid the historical weighted average for the year, it can be stale. Enter possible dilution from options separately in the advanced options. Use the same unit as the other amounts.' },
    dil:{ short:'Dilutive shares', name:'Dilutive shares (options, RSUs, convertibles)', what:'Shares that may be added from options, employee stock awards or convertible bonds. They split the value across more pieces.', where:'Annual report, stock-based compensation note. Include only instruments likely to be exercised.' },
    mos:{ short:'Required margin', sym:'MoS', name:'Required margin of safety', what:'How far below intrinsic value the price must be for you to call the stock a bargain. It protects you from errors in your estimates.', where:'Benjamin Graham suggested about a third. 20–30% is common; less for stable companies, more for uncertain ones.', typ:'20–30%' }
  },

function hydrate(raw){
  const d = DEFAULTS(), r = (raw && typeof raw === 'object') ? raw : {}, s = d;
  for (const k of Object.keys(FM)) if (k !== 'customG' && k in r) s[k] = isNum(r[k]) ? r[k] : null;
  for (const k of ['name', 'ticker']) if (typeof r[k] === 'string') s[k] = r[k].slice(0, k === 'ticker' ? 10 : 60);
  if (CURS.includes(r.currency)) s.currency = r.currency;
  if (['th', 'm', 'bn'].includes(r.unit)) s.unit = r.unit;
  if (['op', 'fin'].includes(r.ctype)) s.ctype = r.ctype;
  if (['simple', 'detailed'].includes(r.method)) s.method = r.method;
  if (['constant', 'fade', 'custom'].includes(r.growthMode)) s.growthMode = r.growthMode;
  if (['capm', 'custom'].includes(r.waccMode)) s.waccMode = r.waccMode;
  if (['gordon', 'exit'].includes(r.tvMethod)) s.tvMethod = r.tvMethod;
  s.midYear = r.midYear === true;
  s.customG = Array.isArray(r.customG) ? r.customG.slice(0, 20).map(x => isNum(x) ? x : null) : [];
  if (r.scen && typeof r.scen === 'object') for (const k of ['bear', 'base', 'bull']) {
    const src = r.scen[k] || {};
    for (const f of Object.keys(s.scen[k])) if (f in src) s.scen[k][f] = isNum(src[f]) ? src[f] : null;
  }
  s.bad = {};
  if (r.bad && typeof r.bad === 'object') for (const k of Object.keys(r.bad)) if (typeof r.bad[k] === 'string') s.bad[k] = r.bad[k].slice(0, 40);
  s.seen = (r.seen && typeof r.seen === 'object') ? r.seen : {};
  s.touched = (r.touched && typeof r.touched === 'object') ? r.touched : {};
  s.ui = { adv: (r.ui && r.ui.adv && typeof r.ui.adv === 'object') ? r.ui.adv : {} };
  s.id = typeof r.id === 'string' ? r.id : null;
  s.sample = r.sample === true; s.dirty = r.dirty === true;
  s.step = Math.max(0, Math.min(7, (r.step | 0)));
  if (!(Number.isInteger(s.horizon) && s.horizon >= 3 && s.horizon <= 20)) { if (s.bad.horizon == null) s.horizon = s.horizon == null && 'horizon' in r ? null : 5; }
  return s;
}

  const attrs = (o.goto != null ? ` data-goto="${o.goto}"` : '') + (o.focus ? ` data-focus="${o.focus}"` : '') + (o.hint ? ` data-hint="${o.hint}"` : '');
  const tag = (o.goto != null || o.focus) ? 'button' : 'span';
  return `<${tag}${tag === 'button' ? ' type="button"' : ''} class="tok${o.mirror ? ' tok-mirror' : ''}"${attrs}><span class="tok-sym">${label}</span><span class="tok-box" data-out="${outKey}"></span></${tag}>`;
}
const result = (cap, lab, outKey, unit, hint) => `<div class="f-result">${cap ? `<span class="f-res-cap">${cap}</span>` : ''}<div class="f-res-row">${lab ? lhs(lab, false, hint) : ''}${op('=')}<span class="f-val" data-out="${outKey}"></span>${unit ? `<span class="f-unit">${unit}</span>` : ''}<span class="f-check">${ic('check')}</span></div></div>`;
const inl = outKey => `<span class="f-inl">${op('=')}<span class="f-inl-v" data-out="${outKey}"></span></span>`;
const helpBox = () => `<aside class="help" id="help" aria-live="polite"></aside>`;
const warnBox = i => `<div class="warns" data-render="warns" data-i="${i}"></div>`;
function seg(key, opts, curVal){
  return `<div class="seg" role="group">${opts.map(([v, l]) => { const on = String(curVal) === String(v); return `<button type="button" class="${on ? 'on' : ''}" data-set="${key}" data-val="${v}" aria-pressed="${on}">${l}</button>`; }).join('')}</div>`;
}
const advRow = (label, desc, control, forId) => `<div class="adv-row"><div class="adv-text">${forId ? `<label for="${forId}">${label}</label>` : `<span class="lbl">${label}</span>`}${desc ? `<p>${desc}</p>` : ''}</div>${control}</div>`;
const advField = key => advRow(L.f[key].name, L.f[key].what, slot(key, { chain:false, noLabel:true, cls:'slot-sm', ph:'—' }), 'in-' + key);
function adv(rows){
  const open = S.ui.adv[S.step] ? ' open' : '';
  return `<details class="adv" data-adv="${S.step}"${open}><summary>${ic('chev')}${L.adv} <span class="adv-hint">${L.advHint}</span></summary><div class="adv-body">${rows.filter(Boolean).join('')}</div></details>`;
}
function head(i, lede){
  return `<header class="st-head"><p class="eyebrow">${fmt(L.stepOf, { i:i + 1, n:8 })} · ${L.steps[i]}</p><h1>${L.st[i].title}</h1><p class="lede">${lede || L.st[i].lede}</p></header>`;
}
function nav(i){
  const prev = i > 0 ? `<button type="button" class="btn" data-nav="prev">${ic('left')}${L.back}</button>` : '<span></span>';
  const next = i < 7 ? `<button type="button" class="btn btn-primary" data-nav="next" id="btn-next">${i === 6 ? L.showVerdict : L.next}${ic('right')}</button>` : '<span></span>';
  return `<div class="nav">${prev}<span class="kbd-hint">${L.kbd}</span>${next}</div>`;
}
function chip(v){
  if (!v) return '';
  const m = { meet:['good', 'up'], thin:['neutral', 'dot'], above:['bad', 'down'], neg:['bad', 'alert'] }[v.k];
  return `<span class="chip ${m[0]}">${ic(m[1])}${L.v[v.k]}</span>`;
}
const finBox = () => S.ctype === 'fin' ? `<div class="explain fin">${ic('alert')}<p><b>${L.ct.warnT}</b> ${L.ct.warn}</p></div>` : '';

/* ================= outputs ================= */
function scenRow(k, id){
  const x = SC[k]; if (!x) return '—';
  const r = x.R;
  if (id === 'g') {
    const d = k === 'base' ? 0 : (S.scen[k].dg || 0);
    if (S.growthMode === 'custom') return L.sc.custom + (d ? ' ' + fmtDelta(d) : '');
    return isNum(S.g) ? pct(P(S.g + d)) : '—';
  }
  if (id === 'w') return pct(r.wacc, 1);
  if (id === 't') return pct(r.gT, 1);
  if (id === 'm') return mult(r.mult);
  if (id === 'mg') return pct(r.mT, 1);
  return '—';
}
function out(key){
  if (key.startsWith('sc.')) {
    const [, k, f] = key.split('.');
    const x = SC[k]; if (!x) return '—';
    if (f === 'v') return isNum(x.v) ? cur(x.v) : (x.err ? L.sc.invalid : '—');

    }
    case 're': return pct(R.re, 2);
    case 'ew': return pct(R.ew, 0);
    case 'extraPrem': return pct(P(S.extraPrem || 0), 1);
    case 'wacc': return pct(R.wacc, 2);
    case 'gT': return isNum(S.gT) ? pct(P(S.gT), 1) : '—';
    case 'tv': return amt(R.tv);
    case 'sumPV': return amt(R.sumPV);

    case 'ev': return amt(R.ev);
    case 'equity': return amt(R.equity);

      if (S.tvMethod === 'exit') return isNum(R.impliedG) ? fmt(L.tvImpG, { v: pct(R.impliedG, 1) }) : '';
      return isNum(R.impliedMult) ? fmt(L.tvImpMult, { v: mult(R.impliedMult), base: S.method === 'detailed' ? 'EBITDA' : 'FCFF' }) : '';
    case 'tvNote':

    case 'reinv':
      if (!isNum(R.margin0) || !isNum(R.nwcP) || !isNum(R.marginT)) return '—';
      return fmt(L.reinv, { m0: pct(R.margin0, 1), mT: pct(R.marginT, 1), n: N || 'N', da: pct(R.daP, 1), cx: pct(R.cxP, 1), nw: pct(R.nwcP, 1), nwAbs: nf(100 * R.nwcP, 1), c: curSym() });
    case 'dfNote': {
      const y = R.years && R.years[0];
      return y && isNum(y.df) ? fmt(L.dfNote, { df: nf(y.df, 3, 3), v: nf(100 * y.df, 1, 1), c: curSym() }) : '';
    }
    default: return '';
  }
}

/* ================= charts ================= */
function niceStep(range, count){
  const raw = range / count, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function barPath(x, y0, y1, w, r){
  const h = Math.abs(y1 - y0); r = Math.min(r, h, w / 2);
  if (h < 0.5) return `M${x} ${y0}h${w}v-0.5h${-w}Z`;
  if (y1 < y0) return `M${x} ${y0}V${y1 + r}Q${x} ${y1} ${x + r} ${y1}H${x + w - r}Q${x + w} ${y1} ${x + w} ${y1 + r}V${y0}Z`;
  return `M${x} ${y0}V${y1 - r}Q${x} ${y1} ${x + r} ${y1}H${x + w - r}Q${x + w} ${y1} ${x + w} ${y1 - r}V${y0}Z`;
}
function colChart(el, labels, series, o = {}){
  const W = Math.max(280, Math.round(el.clientWidth || 600)), H = o.h || 220, pl = 44, pr = 8, pt = 22, pb = 26;
  const vals = series.flatMap(s => s.values).filter(isNum);
  if (!vals.length) return '';
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if (hi === lo) hi = lo + 1;
  const step = niceStep(hi - lo, 3); lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const n = labels.length, bw = (W - pl - pr) / n, k = series.length;
  const barW = Math.max(4, Math.min(24, (bw * 0.62 - (k - 1) * 2) / k));
  let grid = '', bars = '', hits = '', endLabel = '';
  const ticks = Math.round((hi - lo) / step);
  for (let i = 0; i <= ticks; i++) {
    const v = lo + i * step, yy = y(v).toFixed(1);
    grid += `<line x1="${pl}" x2="${W - pr}" y1="${yy}" y2="${yy}" class="${Math.abs(v) < step / 1e6 ? 'c-base' : 'c-grid'}"/><text x="${pl - 8}" y="${(+yy + 3.5).toFixed(1)}" class="c-tick" text-anchor="end">${compact(v)}</text>`;
  }
  const every = Math.max(1, Math.ceil(30 / bw));
  labels.forEach((lab, i) => {
    const cx = pl + bw * i + bw / 2, total = k * barW + (k - 1) * 2;
    let x = cx - total / 2;
    series.forEach((s, si) => {
      const v = s.values[i];
      if (isNum(v)) bars += `<path class="c-s${s.c}" d="${barPath(+x.toFixed(1), +y(0).toFixed(1), +y(v).toFixed(1), +barW.toFixed(1), 4)}"/>`;
      if (i === n - 1 && si === o.labelSeries && isNum(v)) {
        const ty = v >= 0 ? y(v) - 7 : y(v) + 15;
        endLabel = `<text x="${(x + barW / 2).toFixed(1)}" y="${ty.toFixed(1)}" class="c-lab" text-anchor="middle">${compact(v)}</text>`;
      }
      x += barW + 2;
    });
    if ((n - 1 - i) % every === 0) grid += `<text x="${cx.toFixed(1)}" y="${H - 8}" class="c-tick" text-anchor="middle">${lab}</text>`;
    const tip = [o.tipHead ? o.tipHead(i) : lab].concat(series.map(s => `${s.name}: ${s.fmt(s.values[i])}`)).join('\n');
    hits += `<rect class="c-hit" x="${(pl + bw * i).toFixed(1)}" y="${pt}" width="${bw.toFixed(1)}" height="${H - pt - pb}" rx="6" data-tip="${esc(tip)}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.aria || '')}">${grid}${bars}${endLabel}${hits}</svg>`;
}
function rangeChart(el){
  if (!OK || !SC.allValid) return '';
  const b = SC.bear.v, m = SC.base.v, u = SC.bull.v, p = S.price;
  const W = Math.max(280, Math.round(el.clientWidth || 600)), H = 124;
  const all = [b, m, u, p];
  let lo = Math.min(...all), hi = Math.max(...all);
  const span = (hi - lo) || Math.abs(hi) || 1;
  lo -= span * 0.3; hi += span * 0.3;
  const pl = 8, pr = 8, x = v => pl + (v - lo) / (hi - lo) * (W - pl - pr), yL = 70;
  const lo2 = Math.min(b, u), hi2 = Math.max(b, u), px = x(p), plx = Math.max(56, Math.min(W - 56, px));

    ${lab(b, L.sc.bear, bx + 8, 'end', yL + 24)}${lab(u, L.sc.bull, ux - 8, 'start', yL + 24)}
    <text x="${mx.toFixed(1)}" y="${yL - 14}" class="r-lab" text-anchor="middle">${esc(cur(m))}</text>
    <circle class="r-hit" cx="${bx.toFixed(1)}" cy="${yL}" r="14" data-tip="${esc(L.sc.bear + ': ' + cur(b))}"/><circle class="r-hit" cx="${ux.toFixed(1)}" cy="${yL}" r="14" data-tip="${esc(L.sc.bull + ': ' + cur(u))}"/><circle class="r-hit" cx="${mx.toFixed(1)}" cy="${yL}" r="14" data-tip="${esc(L.sc.base + ': ' + cur(m))}"/>
  </svg>`;
}
function warnings(i){
  const w = [];
  if (R.err && R.err.step === i) w.push(['bad', peText(R.err), R.err.code === 'negFcf' ? `<button type="button" class="btn btn-sm" data-act="toDetailed">${L.toDetailed}${ic('right')}</button>` : '']);
  if (i === 0 && S.ctype === 'fin') { /* explained next to the choice */ }
  if (i === 1 && S.method === 'detailed' && isNum(R.fcf0) && R.fcf0 <= 0) w.push(['info', L.w.fcfNegD]);
  if (i === 2) {
    const gs = (R.growth || []).filter(isNum); if (gs.length && Math.max(...gs) > 0.25) w.push(['warn', L.w.gHigh]);
    if (R.lossYears) w.push(['info', L.w.taxLoss]);
  }
  if (i === 3 && isNum(R.wacc) && !R.err) { if (R.wacc < 0.05) w.push(['warn', fmt(L.w.waccLow, { v: pct(R.wacc, 1) })]); else if (R.wacc > 0.2) w.push(['warn', fmt(L.w.waccHigh, { v: pct(R.wacc, 1) })]); }
  if (i === 4) {
    if (S.tvMethod === 'gordon' && isNum(S.gT) && S.gT > 4 && !R.err) w.push(['warn', L.w.gTHigh]);

  if (i === 6 && isNum(R.equity) && R.equity <= 0 && !R.err) w.push(['bad', L.w.eqNeg]);

}

const tipEl = () => $('#tip');
function posTip(x, y){
  const t = tipEl(); if (!t) return;
  const w = t.offsetWidth, h = t.offsetHeight;
  let left = x + 14, top = y - h - 12;
  if (left + w > window.innerWidth - 8) left = x - w - 14;
  if (top < 8) top = y + 18;
  t.style.left = Math.max(8, left) + 'px'; t.style.top = top + 'px';
}
document.addEventListener('pointerover', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  const t = tipEl(); if (!t) return;
  if (!el) { t.hidden = true; return; }
  t.textContent = el.getAttribute('data-tip'); t.hidden = false; posTip(e.clientX, e.clientY);
});
document.addEventListener('pointermove', e => { const t = tipEl(); if (t && !t.hidden) posTip(e.clientX, e.clientY); });

/* ================= actions ================= */
function act(a, b){
  switch (a) {
    case 'lang': if (b.dataset.lang !== lang) { lang = b.dataset.lang; L = T[lang]; store.set('dcfk.lang', lang); renderAll(); } break;
    case 'mode': {
      const light = document.documentElement.getAttribute('data-mode') === 'light';
      if (light) document.documentElement.removeAttribute('data-mode'); else document.documentElement.setAttribute('data-mode', 'light');
      store.set('dcfk.mode', light ? 'dark' : 'light');
      const btn = $('[data-act="mode"]'); if (btn) { btn.innerHTML = light ? ic('sun') : ic('moon'); const lab = light ? L.toLight : L.toDark; btn.setAttribute('aria-label', lab); btn.title = lab; }
      break;
    }
    case 'sheet': toggleSheet(); break;
    case 'own': newAnalysis(); break;
    case 'new': if (S.dirty && !S.sample) ask(L.confirmNew, L.start, newAnalysis); else newAnalysis(); break;
    case 'save': saveAnalysis(b); break;
    case 'csv': if (!exportOK()) { toast(L.exportBlocked); break; } exportCSV(); break;
    case 'pdf': if (!exportOK()) { toast(L.exportBlocked); break; } exportPDF(b); break;
    case 'json': exportJSON(); break;
    case 'import': if (S.dirty && !S.sample) ask(L.confirmImport, L.proceed, pickJSON); else pickJSON(); break;
    case 'toDetailed': S.method = 'detailed'; S.dirty = true; scheduleSave(); goTo(1, { focus:true }); break;
    case 'lib': openLib(); break;
  }
}
function newAnalysis(){
  const keep = { method:S.method, ctype:'op', currency: S.sample ? (lang === 'en' ? 'USD' : 'CZK') : S.currency, unit:S.unit, horizon: Number.isInteger(S.horizon) ? S.horizon : 5 };
  S = Object.assign(DEFAULTS(), keep);

}

/* ================= library (saved analyses) ================= */
const Lib = {
  mode:'local', db:null, uid:null, items:[], ask:null,
  readLocal(){ try { const x = JSON.parse(store.get('dcfk.lib') || '[]'); return Array.isArray(x) ? x.map(i => Object.assign({}, i, { localOnly:true })) : []; } catch(e){ return []; } },
  writeLocal(){ return store.set('dcfk.lib', JSON.stringify(this.items.filter(x => x.localOnly).map(x => { const c = Object.assign({}, x); delete c.localOnly; return c; }))); },
  col(){ return this.db.collection('data/users/' + this.uid); },
  async init(){
    this.items = this.readLocal(); updateLibCount();
    if (!hasClaude()) return;
    try {
      const [db, user] = await Promise.all([useCap('db'), useCap('user')]);
      if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      this.db = db; this.uid = uid;
      const snap = await this.col().get();
      const remote = snap.docs.filter(d => d.exists).map(d => Object.assign({}, d.data(), { id:d.id }));
      const ids = new Set(remote.map(x => x.id));
      this.items = remote.concat(this.items.filter(x => !ids.has(x.id)));
      this.mode = 'db';
      updateLibCount(); renderLibIfOpen();
    } catch(e){ this.mode = 'local'; }
  },
  sorted(){ return this.items.slice().sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0)); },
  upsert(entry){ const i = this.items.findIndex(x => x.id === entry.id); if (i >= 0) this.items[i] = entry; else this.items.push(entry); },
  async put(entry){
    if (this.mode === 'db') {
      for (let attempt = 0; attempt < 2; attempt++) {
        try { await this.col().doc(entry.id).set(entry); this.upsert(entry); this.writeLocal(); return 'db'; }
        catch(e){ if (e && e.code === 'unavailable' && attempt === 0) { await sleep(300 + Math.random() * 500); continue; } break; }
      }
      this.mode = 'local';
    }
    const prev = this.items.slice();
    this.upsert(Object.assign({}, entry, { localOnly:true }));
    if (!this.writeLocal()) { this.items = prev; return 'fail'; }
    return 'local';
  },
  async remove(id){
    const it = this.items.find(x => x.id === id); if (!it) return true;
    if (!it.localOnly && this.db) { try { await this.col().doc(id).delete(); } catch(e){ return false; } }
    const prev = this.items.slice();
    this.items = this.items.filter(x => x.id !== id);
    if (it.localOnly && !this.writeLocal()) { this.items = prev; return false; }
    if (!it.localOnly) this.writeLocal();
    return true;
  }
};

/* ================= export & backup ================= */
const capDownloads = useCap('downloads');
function fileBase(){
  const n = (S.name || 'analyza').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'analyza';
  const d = new Date(), pad = x => String(x).padStart(2, '0');
  return `DCF-${n}-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
async function offerFile(name, data, mime){
  const dl = await capDownloads;
  if (dl) {
    try { const r = await dl.save({ filename:name, data }); if (r && r.status === 'saved') toast(fmt(L.fileSaved, { name })); return true; }
    catch(e){
      const c = e && e.code;
      if (c === 'declined') return false;
      if (c === 'rate_limited') { toast(L.tryAgain); return false; }
      if (c && !['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(c)) { toast(L.fileFail); return false; }
    }
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data], { type:mime });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener'; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
    toast(fmt(L.fileSaved, { name }));
    return true;
  } catch(e){ toast(L.fileFail); return false; }
}
function exportJSON(){
  const st = Object.assign({}, S); delete st.ui;
  const data = { format:'dcf-kalkulacka', version:SCHEMA, exportedAt:new Date().toISOString(), lang, state:st };
  offerFile(fileBase() + '.json', JSON.stringify(data, null, 2), 'application/json');
}
function pickJSON(){ const f = $('#json-file'); if (f) { f.value = ''; f.click(); } }
function importJSONFile(input){
  const file = input.files && input.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    let data;
    try { data = JSON.parse(String(rd.result)); } catch(e){ toast(L.importBad); return; }
    if (!data || data.format !== 'dcf-kalkulacka' || !data.state || typeof data.state !== 'object') { toast(L.importBad); return; }
    if (!(data.version >= 1)) { toast(L.importBad); return; }
    if (data.version > SCHEMA) { toast(L.importNewer); return; }
    S = hydrate(data.state); S.id = null; S.sample = false; S.dirty = true; S.step = 7;
    for (let i = 0; i < 8; i++) S.seen[i] = true;
    renderAll(); scheduleSave(); scrollToTop(); toast(L.imported);
  };
  rd.onerror = () => toast(L.importBad);
  rd.readAsText(file);
}
/* every assumption needed to reproduce the result */
function assumptions(){

  add(L.as.method, D ? L.m.detailed.t : L.m.simple.t);
  add(L.as.currency, S.currency); add(L.as.unit, unitAmt());
  if (!D) {
    add(lbl('cfo'), amt(S.cfo), S.cfo, unitAmt()); add(lbl('interest'), amt(S.interest), S.interest, unitAmt());
    add(lbl('tax'), ...pctIn('tax')); add(lbl('capex'), amt(S.capex), S.capex, unitAmt());
    if (isNum(S.fcfAdj) && S.fcfAdj) add(lbl('fcfAdj'), amt(S.fcfAdj), S.fcfAdj, unitAmt());
  } else {

    add(lbl('tax'), ...pctIn('tax')); add(lbl('da'), amt(S.da), S.da, unitAmt()); add(lbl('capex'), amt(S.capex), S.capex, unitAmt());
    add(lbl('dnwc'), amt(S.dnwc), S.dnwc, unitAmt()); add(lbl('nwc'), amt(S.nwc), S.nwc, unitAmt()); add(L.as.nwcP, pct(R.nwcP, 2), isNum(R.nwcP) ? R.nwcP * 100 : null, '%');
    add(lbl('nol'), isNum(S.nol) ? amt(S.nol) : '0', isNum(S.nol) ? S.nol : 0, unitAmt());
    add(lbl('targetMargin'), isNum(S.targetMargin) ? pct(P(S.targetMargin), 2) : pct(R.margin0, 2), isNum(S.targetMargin) ? S.targetMargin : (isNum(R.margin0) ? R.margin0 * 100 : null), '%');
  }

function exportCSV(){

    rows.push(['EBIT'].concat(cols.map(y => n(y.ebit)))); rows.push([cs ? 'Daň' : 'Tax'].concat(cols.map(y => n(y.tax)))); rows.push(['NOPAT'].concat(cols.map(y => n(y.nopat))));

  rows.push([L.br.ev, n(R.ev), unitAmt()]); rows.push([L.br.debt, n(S.debt), unitAmt()]); rows.push([L.br.cash, n(S.cash), unitAmt()]);
  rows.push([L.br.opCash, n(S.opCash || 0), unitAmt()]); rows.push([L.br.minority, n(S.minority || 0), unitAmt()]);
  rows.push([L.br.eq, n(R.equity), unitAmt()]); rows.push([L.br.shares, n(R.nShares, 6), unitSh()]); rows.push([L.br.ps, n(R.perShare), S.currency]);
  rows.push([L.f.price.name, n(S.price), S.currency]); rows.push([L.upside + ' (%)', n(R.upside * 100)]); rows.push(['MoS (%)', n(isNum(R.mosNow) ? R.mosNow * 100 : null)]);
  verdictLines().forEach(t => rows.push([L.rep.verdict, t]));
  rows.push([]);
  rows.push([L.csv.scen].concat(ks.map(k => L.sc[k])));
  rows.push([L.rep.iv + ' (' + S.currency + ')'].concat(ks.map(k => isNum(SC[k].v) ? n(SC[k].v) : L.sc.invalid)));
  rows.push(['WACC (%)'].concat(ks.map(k => n(SC[k].R.wacc * 100, 4))));
  if (S.tvMethod === 'exit') rows.push([L.sc.m].concat(ks.map(k => n(SC[k].R.mult, 2)))); else rows.push([L.sc.t + ' (%)'].concat(ks.map(k => n(SC[k].R.gT * 100, 4))));
  rows.push([L.weightsQ].concat(ks.map(k => nAuto(SC[k].p))));
  rows.push([L.weightsQ + ' (' + L.as.share + ', %)'].concat(ks.map(k => n(shareOf(k) * 100, 2))));
  ks.forEach(k => { if (SC[k].err) rows.push([fmt(L.rep.scenErr, { name:L.sc[k], why:peText(SC[k].err) })]); });
  if (isNum(SC.weighted)) rows.push([fmt(L.weighted, { w: sharesTxt(), v:'' }).replace(/:\s*$/, ''), n(SC.weighted), S.currency]);
  rows.push([]);
  rows.push([L.disclaimer]);
  const csv = '﻿' + rows.map(r => r.map(q).join(sep)).join('\r\n');
  offerFile(fileBase() + '.csv', csv, 'text/csv;charset=utf-8');
}
const LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
let libsP = null;
const loadScript = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.async = true; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); (document.head || document.body).appendChild(s); });
function ensureLibs(){
  if (window.html2canvas && window.jspdf) return Promise.resolve();
  return libsP || (libsP = Promise.all(LIBS.map(loadScript)).catch(e => { libsP = null; throw e; }));
}
/* report content as blocks; tables can split across pages, everything else moves whole */
function reportBlocks(){
  const D = S.method === 'detailed', Y = R.years, ks = ['bear', 'base', 'bull'];
  const blocks = [];
  const nm = S.name || L.untitled;
  blocks.push({ html:`<h1 class="${nm.length > 34 ? 'long' : ''}">${esc(nm)}${S.ticker ? `<span>${esc(S.ticker)}</span>` : ''}</h1><p class="rp-sub">${L.rep.sub} · ${D ? L.m.detailed.t : L.m.simple.t} · ${L.ct.op.t}</p>` });
  blocks.push({ html:`<div class="rp-hero"><div><span class="rp-k">${L.rep.iv}</span><span class="rp-big">${cur(R.perShare)}</span></div><div><span class="rp-k">${L.price}</span><span class="rp-mid">${cur(S.price)}</span></div><div><span class="rp-k">${L.upside}</span><span class="rp-mid">${spct(R.upside, 1)}</span></div><div><span class="rp-k">${L.rep.verdict}</span><span class="rp-mid rp-v-${V ? V.k : ''}">${V ? L.v[V.k] : '—'}</span></div></div>` });
  blocks.push({ html:`<p class="rp-text">${verdictLines().join(' ')}</p>` });
  const bridge = [[L.br.sumPV, amt(R.sumPV)], [L.br.pvTV, amt(R.pvTV)], [L.br.ev, amt(R.ev), 1], [L.br.debt, amt(S.debt)], [L.br.cash, amt(S.cash)]]
    .concat(isNum(S.opCash) && S.opCash ? [[L.br.opCash, amt(S.opCash)]] : [])
    .concat(isNum(S.minority) && S.minority ? [[L.br.minority, amt(S.minority)]] : [])
    .concat([[L.br.eq, amt(R.equity), 1], [L.br.shares, amt(R.nShares) + ' ' + unitSh()], [L.br.ps, cur(R.perShare), 1]]);
  blocks.push({ title:`${L.rep.bridge} (${unitAmt()})`, rows: bridge.map(([l, v, s]) => `<tr${s ? ' class="sum"' : ''}><td>${l}</td><td>${v}</td></tr>`) });
  const as = assumptions(), pairs = [];
  for (let i = 0; i < as.length; i += 2) pairs.push(`<tr><td>${esc(as[i][0])}</td><td>${esc(as[i][1])}</td>${as[i + 1] ? `<td>${esc(as[i + 1][0])}</td><td>${esc(as[i + 1][1])}</td>` : '<td></td><td></td>'}</tr>`);
  blocks.push({ title:L.rep.assump, rows:pairs, cls:'pairs' });
  const cols = Y.concat(R.next && S.tvMethod === 'gordon' ? [R.next] : []);
  const val = (y, f) => y[f] == null ? '' : f === 'g' || f === 'margin' ? pct(y[f], 1) : f === 'df' ? nf(y[f], 3, 3) : amt(y[f]);
  const projDefs = [[L.tb.growth, 'g']].concat(D ? [[L.tb.rev, 'rev'], [L.tb.margin, 'margin'], ['EBIT', 'ebit'], ['NOPAT', 'nopat'], ['D&A', 'da'], ['CapEx', 'capex'], ['ΔNWC', 'dnwc']] : []).concat([['FCFF', 'fcf', 1], [L.tb.df, 'df'], [L.tb.pv, 'pv', 1]]);
  for (let a = 0; a < cols.length; a += 11) {
    const part = cols.slice(a, a + 11);
    blocks.push({ title: a === 0 ? `${L.rep.proj} (${unitAmt()})` : '', cls:'rp-proj', head:`<tr><th></th>${part.map(y => `<th>${y.t > Y.length ? 'N+1' : L.yr + y.t}</th>`).join('')}</tr>`, rows: projDefs.map(([l, f, s]) => `<tr${s ? ' class="sum"' : ''}><td>${l}</td>${part.map(y => `<td>${val(y, f)}</td>`).join('')}</tr>`) });
  }
  const how = S.tvMethod === 'exit' ? fmt(L.rep.tvHowX, { m: mult(R.mult) }) : fmt(L.rep.tvHowG, { f: amt(R.fcfNext) });
  blocks.push({ html:`<p class="rp-note">${fmt(L.rep.tvLine, { tv: amt(R.tv), how, pv: amt(R.pvTV), sh: pct(R.tvShare, 0) })} ${esc(out('tvImplied'))}</p>` });
  const tvn = out('tvNote'); if (tvn) blocks.push({ html:`<p class="rp-note">${esc(tvn)}</p>` });
  const exit = S.tvMethod === 'exit';
  const scRows = [[L.rep.iv, ks.map(k => isNum(SC[k].v) ? cur(SC[k].v) : L.sc.invalid), 1], [L.upside, ks.map(k => isNum(SC[k].v) ? spct(SC[k].v / S.price - 1, 1) : '—')], [L.sc.g, ks.map(k => scenRow(k, 'g'))], [L.sc.w, ks.map(k => scenRow(k, 'w'))], exit ? [L.sc.m, ks.map(k => scenRow(k, 'm'))] : [L.sc.t, ks.map(k => scenRow(k, 't'))]]
    .concat(D ? [[L.sc.mg, ks.map(k => scenRow(k, 'mg'))]] : []).concat([[L.weightsQ, ks.map(k => pct(shareOf(k), 0))]]);
  blocks.push({ title:L.scenTitle, head:`<tr><th></th>${ks.map(k => `<th>${L.sc[k]}</th>`).join('')}</tr>`, rows: scRows.map(([l, vs, s]) => `<tr${s ? ' class="sum"' : ''}><td>${l}</td>${vs.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`) });
  ks.forEach(k => { if (SC[k].err) blocks.push({ html:`<p class="rp-warn">${esc(fmt(L.rep.scenErr, { name:L.sc[k], why:peText(SC[k].err) }))}</p>` }); });
  blocks.push({ html:`<p class="rp-note">${isNum(SC.weighted) ? fmt(L.weighted, { w: sharesTxt(), v: cur(SC.weighted) }) : fmt(L.weightedNA, { why: SC.wErr ? L.wNA.w : L.wNA.scen })}</p>` });
  if (SC.bullWorse) blocks.push({ html:`<p class="rp-warn">${L.bullWorse}</p>` });
  if (SC.bearBetter) blocks.push({ html:`<p class="rp-warn">${L.bearBetter}</p>` });
  [1, 2, 3, 4, 5, 6].forEach(i => warnings(i).forEach(([, t]) => blocks.push({ html:`<p class="rp-warn">${t.replace(/<[^>]+>/g, '')}</p>` })));
  return blocks;
}
function paginate(blocks){
  const host = $('#report-host'); host.innerHTML = '';
  const date = new Intl.DateTimeFormat(L.loc, { dateStyle:'long' }).format(new Date());
  const pages = []; let body = null;
  const newPage = () => {
    const p = document.createElement('section'); p.className = 'rp';
    p.innerHTML = `<header class="rp-top">${logoSvg('rp-logo', '#141413')}<span class="rp-brand">${L.appName}</span><span class="rp-date">${date}</span></header><div class="rp-body"></div><footer class="rp-foot"><span>${L.disclaimer}</span><span class="rp-pn"></span></footer>`;
    host.appendChild(p); pages.push(p); body = p.querySelector('.rp-body');
  };
  const fits = () => body.scrollHeight <= body.clientHeight + 1;
  newPage();
  for (const b of blocks) {
    if (!b.rows) {
      const w = document.createElement('div'); w.className = 'rp-blk'; w.innerHTML = b.html; body.appendChild(w);
      if (!fits() && body.children.length > 1) { w.remove(); newPage(); body.appendChild(w); }
      continue;
    }
    let rows = b.rows.slice(), first = true;
    while (rows.length) {
      const w = document.createElement('div'); w.className = 'rp-blk';
      w.innerHTML = (first && b.title ? `<h2>${b.title}</h2>` : '') + `<table class="rp-t ${b.cls || ''}">${b.head ? `<thead>${b.head}</thead>` : ''}<tbody></tbody></table>`;
      body.appendChild(w);
      const tb = w.querySelector('tbody'); let placed = 0;
      while (rows.length) {
        const tmp = document.createElement('tbody'); tmp.innerHTML = rows[0];
        const tr = tmp.firstElementChild; tb.appendChild(tr);
        if (!fits() && !(placed === 0 && body.children.length === 1)) { tr.remove(); break; }
        rows.shift(); placed++;
      }
      if (!placed) { w.remove(); newPage(); continue; }
      first = false;
      if (rows.length) newPage();
    }
  }
  pages.forEach((p, i) => { p.querySelector('.rp-pn').textContent = fmt(L.rep.page, { i:i + 1, n:pages.length }); });
  return pages;
}
async function exportPDF(btn){
  if (btn) btn.setAttribute('aria-busy', 'true');
  const host = $('#report-host');
  try {
    await ensureLibs();
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const pages = paginate(reportBlocks());
    const pdf = new window.jspdf.jsPDF({ unit:'pt', format:'a4', orientation:'portrait', compress:true });
    for (let i = 0; i < pages.length; i++) {
      const c = await window.html2canvas(pages[i], { scale:2, backgroundColor:'#FFFFFF', logging:false, useCORS:true, windowWidth:1200 });
      if (i) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 595.28, 841.89);
    }
    const blob = pdf.output('blob');
    host.innerHTML = '';
    await offerFile(fileBase() + '.pdf', blob, 'application/pdf');
  } catch(e){ host.innerHTML = ''; toast(L.pdfFail); }
  finally { if (btn) btn.removeAttribute('aria-busy'); }
}

let saveT = null;
function scheduleSave(){
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    const ok = store.set('dcfk.draft', JSON.stringify(S));
    if (!ok && storageOK) { storageOK = false; toast(L.draftFail); renderLedger(); }
    else if (ok && !storageOK) { storageOK = true; renderLedger(); }
  }, 300);
}
function boot(hotData){
  let raw = hotData && hotData.S;
  if (!raw) { try { raw = JSON.parse(store.get('dcfk.draft') || 'null'); } catch(e){ raw = null; } }
  S = raw ? hydrate(raw) : sampleState();
  renderAll();
  Lib.init();
}
try { if (window.claude && window.claude.hot && typeof window.claude.hot.snapshot === 'function') window.claude.hot.snapshot(() => ({ S })); } catch(e){}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot((hot && hot.data) || {});
})();
